name: FastStats Shadow Release

on:
  workflow_dispatch:
    inputs:
        version:
            description: 'Version to build'
            required: true
            default: '0.26.0'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to DevMatthiesenMavenRepository
        run: ./gradlew :faststats:publishAllPublicationsToDevMatthiesenMavenRepository
        env:
          FASTSTATS_VERSION: ${{ github.event.inputs.version }}
          ORG_GRADLE_PROJECT_devMatthiesenMavenUsername: ${{ secrets.ORG_GRADLE_PROJECT_DEVMATTHIESENMAVENUSERNAME }}
          ORG_GRADLE_PROJECT_devMatthiesenMavenPassword: ${{ secrets.ORG_GRADLE_PROJECT_DEVMATTHIESENMAVENPASSWORD }}
